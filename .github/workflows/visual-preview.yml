name: Visual preview

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "tests/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/visual-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm install

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Generate responsive previews
        run: npx playwright test

      - name: Upload visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-platform-responsive-previews
          path: visual-previews/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-platform-playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-platform-playwright-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
